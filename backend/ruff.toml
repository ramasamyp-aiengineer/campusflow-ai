target-version = "py312"
line-length = 120
src = ["app", "tests"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  # FastAPI Depends() defaults are intentional.
  "B008",
  # Seed fixtures and prompts are long by design.
  "E501",
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
